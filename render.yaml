services:
  - type: web
    name: smartlife
    runtime: node
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartlife-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: BCRYPT_ROUNDS
        value: "12"

databases:
  - name: smartlife-db
    databaseName: smartlife
    plan: free
